<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XAU Trade Chart</title>
<style>
:root{--bg:#0c3b55;--panel:#0a3049;--ink:#e8f6ef;--mute:#9cc3c4;--up:#3ddc84;--down:#ff6a3d;--line:rgba(61,220,132,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:12px 12px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.05rem}
.px{font-size:1.05rem;font-weight:700}
.tf button{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 11px;border-radius:6px;font:inherit;font-size:.85rem;margin-left:4px}
.tf button.on{background:var(--up);color:#06281a;border-color:var(--up)}
#chart{height:52vh;min-height:300px;position:relative;overflow:hidden;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.leg button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 10px;margin-left:4px;font:inherit}
.leg{padding:6px 12px;font-size:.72rem;color:var(--mute)}
.leg b.a{color:#ffd24a}.leg b.b{color:#6ec6ff}
.sig{margin:8px 10px;border-radius:10px;padding:12px 8px;text-align:center;font-weight:800;font-size:1.3rem;border:2px solid var(--line);background:rgba(0,0,0,.3);color:var(--mute)}
.sig small{display:block;font-weight:400;font-size:.72rem;margin-top:3px}
.sig.long{background:var(--up);color:#06281a;border-color:var(--up)}
.sig.short{background:var(--down);color:#2a0d02;border-color:var(--down)}
.sig.zl{background:rgba(61,220,132,.16);color:var(--up);border-color:var(--up)}
.sig.zs{background:rgba(255,106,61,.16);color:var(--down);border-color:var(--down)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem}
.row{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px dotted rgba(156,195,196,.3)}
.row:last-child{border-bottom:0}
.row span:last-child{font-weight:700;text-align:right}
.ok{color:var(--up)}.no{color:var(--down)}.nu{color:var(--mute)}
.card h2{margin:0 0 4px;font-size:.8rem;color:var(--mute)}
label{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0}
input{width:84px;background:#06283d;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit;text-align:right}
.note{padding:10px 12px;color:var(--mute);font-size:.72rem;line-height:1.5}
</style>
</head>
<body>
<header><h1>XAU trade chart</h1><span class="px" id="px">-</span><div class="tf" id="tf"></div></header>
<div id="chart"></div>
<div class="leg"><b class="a">EMA 20</b> / <b class="b">EMA 50</b> - Entry, SL, TP lines chart-il thanne varum. Samayam IST. <button onclick="zoom(-20)" style="margin-left:6px">+</button><button onclick="zoom(20)">-</button></div>
<div class="sig" id="sig">Loading...</div>
<div class="grid">
 <div class="card" id="chk"></div>
 <div class="card" id="plan"></div>
</div>
<div class="grid" style="margin-top:8px">
 <div class="card"><h2>Lot size</h2>
  <label>Balance ($)<input id="bal" type="number" value="1000"></label>
  <label>Risk (%)<input id="rk" type="number" value="1" step="0.5"></label>
  <div id="lot"></div></div>
 <div class="card" id="lvl"></div>
</div>
<div class="note" id="note"></div>
<script>
var KM={"5m":{bn:"5m",by:"5",kr:5,h:"1h"},"15m":{bn:"15m",by:"15",kr:15,h:"1h"},"1h":{bn:"1h",by:"60",kr:60,h:"4h"},"4h":{bn:"4h",by:"240",kr:240,h:"1d"},"1d":{bn:"1d",by:"D",kr:1440}};
var cur="15m",SRC="",IST=19800,last=null;
function mapB(a){return a.map(function(k){return{t:Math.floor(+k[0]/1000),o:+k[1],h:+k[2],l:+k[3],c:+k[4]}})}
function bin(host,name){return function(k,n){return fetch(host+"/api/v3/klines?symbol=PAXGUSDT&interval="+KM[k].bn+"&limit="+n).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(a){SRC=name;return mapB(a)})}}
var SOURCES=[
 bin("https://api.binance.com","Binance PAXGUSDT"),
 bin("https://data-api.binance.vision","Binance PAXGUSDT"),
 function(k,n){return fetch("https://api.bybit.com/v5/market/kline?category=spot&symbol=PAXGUSDT&interval="+KM[k].by+"&limit="+n).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var l=j.result.list.slice().reverse();if(!l.length)throw 0;SRC="Bybit PAXGUSDT";return mapB(l)})},
 function(k,n){return fetch("https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval="+KM[k].kr).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var key=Object.keys(j.result).filter(function(x){return x!=="last"})[0],l=j.result[key].slice(-n);if(!l.length)throw 0;SRC="Kraken PAXGUSD";return l.map(function(x){return{t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}})})}
];
function getK(k,n){var i=0;function go(){if(i>=SOURCES.length)return Promise.reject(new Error("data"));return SOURCES[i++](k,n).catch(go)}return go()}

function emaArr(c,p){var k=2/(p+1),e=c[0],o=[e];for(var i=1;i<c.length;i++){e=c[i]*k+e*(1-k);o.push(e)}return o}
function rsi(a,p){var g=0,l=0,i;for(i=1;i<=p;i++){var d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}g/=p;l/=p;for(i=p+1;i<a.length;i++){var d2=a[i]-a[i-1];g=(g*(p-1)+(d2>0?d2:0))/p;l=(l*(p-1)+(d2<0?-d2:0))/p}return l===0?100:100-100/(1+g/l)}
function atr(k,p){var s=0;for(var i=k.length-p;i<k.length;i++){var x=k[i],pc=k[i-1].c;s+=Math.max(x.h-x.l,Math.abs(x.h-pc),Math.abs(x.l-pc))}return s/p}
function candle(k){var a=k[k.length-2],b=k[k.length-1],body=Math.abs(b.c-b.o),rng=(b.h-b.l)||1e-9,up=b.h-Math.max(b.o,b.c),lo=Math.min(b.o,b.c)-b.l,r={buy:"",sell:""};
 if(a.c<a.o&&b.c>b.o&&b.c>=a.o&&b.o<=a.c)r.buy="Bullish engulfing";else if(lo>=2*Math.max(body,rng*.05)&&lo>=2*up&&(b.c-b.l)/rng>.6)r.buy="Bullish pin bar";
 if(a.c>a.o&&b.c<b.o&&b.c<=a.o&&b.o>=a.c)r.sell="Bearish engulfing";else if(up>=2*Math.max(body,rng*.05)&&up>=2*lo&&(b.h-b.c)/rng>.6)r.sell="Bearish pin bar";
 return r}
function f(x){return x.toFixed(2)}
function row(a,b,c){return '<div class="row"><span>'+a+'</span><span class="'+(c||"nu")+'">'+b+'</span></div>'}

var cv=document.createElement("canvas");document.getElementById("chart").appendChild(cv);
var ctx=cv.getContext("2d"),D=null,VIS=90;
function draw(){
 var box=cv.parentNode,dpr=window.devicePixelRatio||1,W=box.clientWidth,H=box.clientHeight;
 cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(!D)return;
 var n=D.all.slice(-VIS),off=D.all.length-n.length,PW=62,PH=18,cw=W-PW,ch=H-PH,hi=-1e9,lo=1e9,i,p,y;
 n.forEach(function(x){hi=Math.max(hi,x.h);lo=Math.min(lo,x.l)});
 lines.forEach(function(l){hi=Math.max(hi,l.p);lo=Math.min(lo,l.p)});
 var pad=(hi-lo)*.06;hi+=pad;lo-=pad;
 function Y(v){return ch*(hi-v)/(hi-lo)}
 var step=cw/n.length;
 ctx.font="11px Trebuchet MS,sans-serif";ctx.textBaseline="middle";
 for(i=0;i<=5;i++){p=lo+(hi-lo)*i/5;y=Y(p);ctx.strokeStyle="rgba(156,195,196,.13)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();ctx.fillStyle="#9cc3c4";ctx.textAlign="left";ctx.fillText(f(p),cw+4,y)}
 ctx.textAlign="center";
 for(i=0;i<n.length;i+=Math.ceil(n.length/4)){var dt=new Date((n[i].t+IST)*1000);ctx.fillText(("0"+dt.getUTCHours()).slice(-2)+":"+("0"+dt.getUTCMinutes()).slice(-2),step*i+step/2,H-9)}
 n.forEach(function(x,i){var cx=step*i+step/2,col=x.c>=x.o?"#3ddc84":"#ff6a3d",bw=Math.max(1,step*.65),t1=Y(Math.max(x.o,x.c)),t2=Y(Math.min(x.o,x.c));
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,Y(x.h));ctx.lineTo(cx,Y(x.l));ctx.stroke();ctx.fillRect(cx-bw/2,t1,bw,Math.max(1,t2-t1))});
 function path(arr,col){ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();n.forEach(function(x,i){var cx=step*i+step/2,yy=Y(arr[off+i]);if(i)ctx.lineTo(cx,yy);else ctx.moveTo(cx,yy)});ctx.stroke()}
 path(D.E20,"#ffd24a");path(D.E50,"#6ec6ff");
 lines.forEach(function(l){y=Y(l.p);ctx.strokeStyle=l.col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();
  ctx.fillStyle=l.col;ctx.fillRect(cw,y-8,PW,16);ctx.fillStyle="#06281a";ctx.textAlign="left";ctx.fillText(l.title+" "+f(l.p),cw+3,y)});
 var lp=D.all[D.all.length-1].c;y=Y(lp);ctx.setLineDash([3,3]);ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cw,y);ctx.stroke();ctx.setLineDash([]);
}
window.addEventListener("resize",draw);
function zoom(d){VIS=Math.max(30,Math.min(250,VIS+d));draw()}
var lines=[];
function clearLines(){lines=[]}
function addLine(p,col,title){lines.push({p:p,col:col,title:title})}

function trend(k){var c=k.map(function(x){return x.c}),e20=emaArr(c,20),e50=emaArr(c,50),p=c[c.length-1],a=e20[e20.length-1],b=e50[e50.length-1];
 return{p:p,e20:a,e50:b,dir:(p>b&&a>b)?1:(p<b&&a<b)?-1:0}}

function run(first){
 Promise.all([getK(cur,300),getK(KM[cur].h,150)]).then(function(r){
  var all=r[0],m=all.slice(0,-1),h=r[1].slice(0,-1),live=all[all.length-1].c;
  var c=all.map(function(x){return x.c}),E20=emaArr(c,20),E50=emaArr(c,50);
  D={all:all,E20:E20,E50:E50};
  document.getElementById("px").textContent=f(live);

  var T=trend(h),mc=m.map(function(x){return x.c}),me=emaArr(mc,20),m20=me[me.length-1];
  var b=m[m.length-1],A=atr(m,14),rs=rsi(mc,14),cd=candle(m);
  var nearL=b.l<=m20+0.5*A,nearS=b.h>=m20-0.5*A;
  var longOk=T.dir===1&&!!cd.buy&&nearL&&rs>40&&rs<70;
  var shortOk=T.dir===-1&&!!cd.sell&&nearS&&rs<60&&rs>30;
  var cls="",head="WAIT",sub="Range - HTF trend clear alla, trade illa";
  if(T.dir===1){cls="zl";head="LONG ZONE";sub="Pullback + candle confirm kaathirikkuka"}
  if(T.dir===-1){cls="zs";head="SHORT ZONE";sub="Pullback + candle confirm kaathirikkuka"}
  var ent=live,sl=0,R=0;
  if(longOk){cls="long";head="LONG";sub="Trend + pullback + candle + RSI match";sl=b.l-0.2*A;R=ent-sl}
  if(shortOk){cls="short";head="SHORT";sub="Trend + pullback + candle + RSI match";sl=b.h+0.2*A;R=sl-ent}
  var sg=document.getElementById("sig");sg.className="sig "+cls;sg.innerHTML=head+"<small>"+sub+"</small>";

  var htf=KM[cur].h.toUpperCase();
  document.getElementById("chk").innerHTML='<h2>Checklist</h2>'+
   row(htf+" trend",T.dir===1?"UP":T.dir===-1?"DOWN":"RANGE",T.dir===1?"ok":T.dir===-1?"no":"nu")+
   row("Pullback to EMA20",T.dir===0?"-":(T.dir===1?nearL:nearS)?"Yes \u2714":"Illa \u2716",T.dir===0?"nu":(T.dir===1?nearL:nearS)?"ok":"no")+
   row("Candle",T.dir===0?"-":(T.dir===1?cd.buy:cd.sell)?(T.dir===1?cd.buy:cd.sell)+" \u2714":"Pattern illa \u2716",T.dir===0?"nu":(T.dir===1?cd.buy:cd.sell)?"ok":"no")+
   row("RSI(14)",f(rs),"nu");

  clearLines();
  var plan=document.getElementById("plan"),lvl=document.getElementById("lvl"),lot=document.getElementById("lot");
  if(R>0){
   var d=cls==="long"?1:-1,tp1=ent+d*R,tp2=ent+d*2*R;
   addLine(ent,"#ffffff","ENTRY");addLine(sl,"#ff6a3d","SL");addLine(tp1,"#9be7b4","TP1");addLine(tp2,"#3ddc84","TP2");
   last={R:R};
   plan.innerHTML='<h2>Trade plan</h2>'+row("Entry",f(ent))+row("Stop loss",f(sl),"no")+row("TP1 (1R)",f(tp1),"ok")+row("TP2 (2R)",f(tp2),"ok")+row("Risk / oz","$"+f(R));
   lvl.innerHTML='<h2>Tips</h2><div class="nu" style="line-height:1.5">TP1-il pakuthi book cheyth SL entry-yilekku maattuka. Baaki TP2-vare.</div>';
  }else{
   last=null;
   plan.innerHTML='<h2>Trade plan</h2><div class="nu" style="line-height:1.5">Signal confirm aayaal Entry / SL / TP ivide varum.</div>';
   lvl.innerHTML='<h2>ATR('+cur+')</h2>'+row("ATR",f(A))+row("EMA20",f(m20))+row("HTF EMA50",f(T.e50));
  }
  calcLot();draw();
  document.getElementById("note").innerHTML="Data: "+SRC+" (gold-backed, XAUUSD-ye follow cheyyum, chinna price difference undaakam). Closed candle-il maathram signal. NFP/CPI/FOMC samayam trade ozhivaakku. Educational maathram, financial advice alla. Updated "+new Date().toLocaleTimeString();
 }).catch(function(e){document.getElementById("sig").innerHTML="Data kittiyilla<small>"+(e&&e.message?e.message:"")+" - Network / VPN nokku, 15 sec-il veendum try cheyyum</small>"});
}
function calcLot(){
 var bal=+document.getElementById("bal").value,rk=+document.getElementById("rk").value,el=document.getElementById("lot");
 try{localStorage.setItem("xau_bal",bal);localStorage.setItem("xau_rk",rk)}catch(e){}
 var usd=bal*rk/100;
 if(!last){el.innerHTML=row("Risk","$"+f(usd))+'<div class="nu" style="font-size:.72rem">Signal varumbol lot kaanam</div>';return}
 el.innerHTML=row("Risk","$"+f(usd))+row("Lot","<b>"+(usd/(last.R*100)).toFixed(2)+"</b>","ok")+'<div class="nu" style="font-size:.72rem">1 lot = 100 oz</div>';
}
try{var b0=localStorage.getItem("xau_bal"),r0=localStorage.getItem("xau_rk");if(b0)document.getElementById("bal").value=b0;if(r0)document.getElementById("rk").value=r0}catch(e){}
document.getElementById("bal").oninput=calcLot;document.getElementById("rk").oninput=calcLot;

var tf=document.getElementById("tf");
["5m","15m","1h","4h"].forEach(function(t){var b=document.createElement("button");b.textContent=t;if(t===cur)b.className="on";
 b.onclick=function(){cur=t;[].forEach.call(tf.children,function(c){c.className=""});b.className="on";run(true)};tf.appendChild(b)});
run(true);setInterval(function(){run(false)},15000);
</script>
</body>
</html>
